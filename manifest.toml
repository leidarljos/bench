regenerate = "python3 scripts/tables.py --verdicts results/mab-qa-lexical-top10-11759.jsonl"

[results.mab_cr_hop2]
files = []
dump = "results/mab-dump-cr.jsonl"
logs = ["results/mab-dump-cr-11763.txt", "results/mab-qa-cr-11764.txt"]
jobs = ["jobs/mab-dump-cr.sbatch", "jobs/mab-qa-cr.sbatch"]
questions = 800
top = 10
arms = "fused live (the replacement rule) and fused live hop2 (the objects of the strongest live facts asked about in turn, their live facts following)"
result = "hop2 0.576 against live 0.535 over 800 (+0.041, interval +0.014 to +0.070); multi-hop rows +0.09 to +0.15 (three of four intervals exclude zero), single-hop rows -0.01 to -0.09"
note = "both verdict files are held out of the package: a person's name in one reader answer trips the commit guard; the log carries their tables and the paired difference is in the notes. The same live arm read 0.480 in job 11750 and 0.535 here at temperature zero, so paired differences within one job are the comparison, not raw numbers across jobs"
regenerate = "the log, results/mab-qa-cr-11764.txt"

[results.mab_cr_arms]
files = []
logs = ["results/mab-qa-cr2-11793.txt"]
jobs = ["jobs/mab-survey.sbatch", "jobs/mab-gnn.sbatch", "jobs/mab-dump-cr2.sbatch", "jobs/mab-qa-cr2.sbatch"]
questions = 800
top = 10
arms = "fused live, fused live hop2 (objects of the strongest live facts), fused live saddle (the landscape's lowest passes from the strongest live facts as the second hop), fused live gnn (the GraphSAGE link predictor's inferred edges as the second hop)"
result = "reading accuracy over 800: hop2 0.579, live 0.530, saddle 0.492, gnn 0.490; single-hop rows 0.83 to 0.93 on every arm, multi-hop rows hop2 0.24 to 0.41 against live 0.06 to 0.29, saddle 0.07 to 0.21, gnn 0.06 to 0.19. Retrieval hit at ten over the same 800: hop2 0.739, live 0.615, gnn 0.585, saddle 0.576, fused 0.609"
note = "a negative for the two geometric second hops on this benchmark: the object of a fact names the fact that answers a multi-hop question and neither a pass in embedding space nor an inferred edge does. The saddle and network arms rank below the live arm on retrieval, so the reading loss is a retrieval loss. Verdict files held out of the package for the same reason as mab_cr_hop2"
regenerate = "the log, results/mab-qa-cr2-11793.txt"

[results.hook_scale]
logs = ["results/hook-scale-15510.txt", "results/hook-scale-11821.txt"]
job = "ljos scripts/terra/hook-scale.sbatch with scripts/terra/hook_scale.py: a scratch pack filled with 1000, 5000 and 10000 token-distinct lessons on the build host (dense ballot on, bge-small); the seat's hook on one prompt three times, on eight prompts at once, search, and a dry consolidation, timed by the script"
result = "10000 live memories: hook on one prompt 0.066 to 0.147 s, eight prompts at once 0.206 s, search 0.068 s, a dry consolidation 0.108 s; 5000: 0.038 to 0.089 s, 0.130 s, 0.044 s, 0.082 s; 1000: 0.015 to 0.028 s, 0.060 s, 0.016 s, 0.012 s"
note = "the earlier run (11821) read a dry consolidation past the client's 30 s timeout from 5000 atoms; the bucketed consolidation (first three head words and carried entities, buckets of sixty-four) brings it to a tenth of a second at ten thousand. The hook's budget is a prompt, so a tenth of a second at ten thousand memories is the number the seat protocol paper quotes. A first rerun (15496) wrote lessons from a small vocabulary and the pack's overlap rule closed most of them on arrival, which is the rule working; the script now writes pseudo-word lessons that share no tokens"
regenerate = "sbatch scripts/terra/hook-scale.sbatch in the ljos repository; the log is results/hook-scale-15510.txt"

[results.forgetting]
files = ["results/forgetting-15645.json", "results/forgetting-15631.json"]
logs = ["results/forgetting-15645.txt", "results/forgetting-15631.txt"]
job = "packset scripts/terra/forgetting.sbatch: crates/packset-daemon/examples/forgetting.rs, a synthetic longitudinal corpus of 300 topics, one kept claim recalled on its review clock across 180 days and three paraphrases written late and never reviewed, asked on day 180"
result = "kept claim first / mean rank: lexical only 0.230 / 2.49; 14-day age decay 0.270 / 3.74; FSRS retrievability 0.947 / 1.05; LRU (newest hit first) 0.000 / 8.26; keep-testing (the recall path's due-first order) 0.000 / 10.00"
note = "the review-clock question packset-didl asked, answered on the Rust recall path. Retrievability is the slot that keeps a recalled claim over its unreviewed paraphrases; recency (LRU) inverts it. The recall path's due-first order never returned the kept claim: 15631 with the due queue unbounded (nine hundred due paraphrases filled the budget), 15645 after the due share was bounded to a quarter and narrowed to the cue, hints matched on half their tokens, recall seeded from the lexical hits and tiers ranked by retrievability before recency. The number did not move because due claims lead every tier by design, and the three unreviewed paraphrases of every topic are due. Keep-testing is a review order, not a retrieval ranking; the review clock's value for retrieval is the retrievability slot in search"
regenerate = "sbatch scripts/terra/forgetting.sbatch in the packset repository; FORGETTING_JSON writes the JSON"

[landscape]
crate = "leidarljos/landscape (private while rgsaddle is): Gaussian wells over the embeddings, cores by L-BFGS descent (rgmin), saddles by minimum-mode following (rgsaddle)"
jobs = ["jobs/mab-survey.sbatch (cores and saddles per conflict-resolution record, kernel a third of the neighbour distance)", "jobs/saddle-conflicts.sbatch and jobs/saddle-conflicts2.sbatch (the point-scale saddles scored against the replacement rule)", "jobs/mab-gnn.sbatch (edge inference with a GraphSAGE link predictor; jobs/gnn-env.sbatch builds its environment)", "jobs/mab-dump-cr2.sbatch and jobs/mab-qa-cr2.sbatch (the saddle, network, object-chaining and live arms in one reading job)"]
saddle_conflicts = "record 0 (455 facts, 191 same-head pairs): precision at 50 0.90 (scale 0.2) and 0.94 (0.15), recall 0.92 and 0.94; record 4 carries the same facts and repeats the numbers; record 1 (2310 facts, 1645 pairs, five neighbours): precision at 50 0.94, at 100 0.93, recall 0.56"

[results.synthetic_voters]
log = "results/voters-11808.txt"
job = "jobs/voters.sbatch"
code = "consensus crate, examples/synthetic_voters.rs (the real settle, Dawid-Skene and log-odds rules on voters of known accuracy)"
protocol = "voters with accuracies uniform in [0.35, 0.95], two-way questions with a known truth, 20 seeds; group accuracy per rule"
result = "9 voters, 400 questions: majority 0.820, linear calibration 0.873, log-odds calibration 0.934, oracle log-odds 0.939, Hedge 0.831, Hedge with fixed share 0.877, running record as log odds 0.929; 15 voters 0.877 / 0.936 / 0.974 / 0.976 / 0.891 / 0.937 / 0.972"
regenerate = "cargo run --release --example synthetic_voters -- 9 400 20 (deterministic seeds)"
