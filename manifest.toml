# What every number in this package was made from. Hashes are sha256.

[package]
name = "leidarljos-bench"
date = "2026-09-12"
description = "Reproducibility package for the seat's memory and consensus measurements"
tables = "python3 scripts/tables.py ..."   # every table regenerates from results/ with no model call

[datasets.longmemeval_s]
url = "https://huggingface.co/datasets/xiaowu0162/longmemeval/resolve/main/longmemeval_s"
file = "longmemeval_s.json"
sha256 = "08d8dad4be43ee2049a22ff5674eb86725d0ce5ff434cde2627e5e8e7e117894"
bytes = 278025796
questions = 500
answerable = 470            # `_abs` questions carry no answer session and are left out
doi = "10.48550/arXiv.2410.10813"

[datasets.memoryagentbench]
url = "https://huggingface.co/datasets/ai-hyz/MemoryAgentBench"
paper = "10.48550/arXiv.2507.05257"
files = "Accurate_Retrieval.parquet, Conflict_Resolution.parquet, Test_Time_Learning.parquet, Long_Range_Understanding.parquet (the parquet export of the default config)"
sha256_accurate_retrieval = "56c3cd80fb6731a3e53cd1a6be3148f54df60ff2d290ee50e28f8acebf9655c1"
sha256_conflict_resolution = "24d5c3f09ce0ce15625cb9f8a98f44f0d864ca6c94d7b4ad04eb697ca3a5ff45"
sha256_test_time_learning = "5338753be48f925d03318eed66117286e3489025fabe050a547bd086cd7d79c0"
sha256_long_range_understanding = "5ab175461954db67770d4a4cb69e569b513ebb96aceb9ee79b57f67488bcd539"
fetch = "jobs/mab-get.sbatch (parquet to JSONL with pyarrow in a venv)"
harness = "crates/packset-daemon/examples/memoryagentbench.rs; scripts/longmemeval_qa.py --bench mab"
chunking = "384 words a chunk (the benchmark's 512 model tokens); fact lists one fact a document"

[datasets.locomo10]
url = "https://github.com/snap-research/locomo"
file = "locomo10.json"
sha256 = "79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4"
conversations = 10
questions = 1986
doi = "10.48550/arXiv.2402.17753"

[models.encoder]
name = "multilingual-e5-large"                      # PACKSET_EMBED_MODEL=e5-large-v2 resolves to this
provider = "fastembed 6, model MultilingualE5Large (Qdrant/multilingual-e5-large-onnx)"
role = "query and document vectors for the dense ballot"
hardware = "CPU, 12 to 16 threads"

[models.reranker]
name = "bge-reranker-base"
provider = "fastembed 6, RerankerModel::BGERerankerBase"
role = "the cross-encoder arm, a measured negative"

[models.reader]
name = "Qwen2.5-7B-Instruct-Q5_K_M.gguf"
url = "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q5_K_M.gguf"
sha256 = "2e998d7e181c8756c5ffc55231b9ee1cdc9d3acec4245d6e27d32bd8e738c474"
bytes = 5444831936
role = "reader and judge for every answer-accuracy row"
server = "llama.cpp llama-server, commit 3057bb66c86c46d5781e50e85462a760ba7d1feb, built with CUDA 13.3 for sm_120"
flags = "-c 65536 -np 2 -ngl 99 -fa on, temperature 0, reader max_tokens 512, judge max_tokens 8"
hardware = "one NVIDIA GeForce RTX 5070, 12 GB"

[software]
packset_repository = "https://github.com/leidarljos/packset"
packset_harness = "crates/packset-daemon/examples/longmemeval.rs, examples/locomo_dump.rs, scripts/longmemeval_qa.py"
packset_commit_retrieval_full = "045b3d3"          # the 470-question retrieval run and the 100-question dumps
packset_commit_rerank = "cbf8b41"                  # the rerank arm
packset_commit_recency_and_dump_all = "df9a537"    # the recency arm and the 470-question dump
packset_commit_locomo = "db12aa6"                  # the LoCoMo dump and QA mode
rust = "1.98.0 (88d9e12ae 2026-08-18)"
scheduler = "Slurm on one node: 32 cores, 46 GB, one RTX 5070"
prompts = "LongMemEval's reading prompt and type-specific judge prompts, reproduced in scripts/longmemeval_qa.py of packset from the benchmark's evaluation code; LoCoMo uses the same base judge prompt and a short reading prompt, category 5 left out"

[results.lme_retrieval_full]
file = "results/lme-full-retrieval-11653.txt"
job = "jobs/lme-full.sbatch"
questions = 470
arms = ["turns", "windows", "sessions", "sessions dense", "sessions fused"]

[results.lme_dump_all]
file = "results/lme-dump-all.jsonl"
job = "jobs/lme-dump-all.sbatch"
questions = 470
arms = ["sessions", "sessions dense", "sessions fused", "sessions fused recency", "turns", "windows"]
regenerate = "python3 scripts/tables.py results/lme-dump-all.jsonl"

[results.lme_dump_100_rerank]
file = "results/lme-dump-100-rerank.jsonl"
job = "jobs/lme-rerank.sbatch"
questions = 100
regenerate = "python3 scripts/tables.py results/lme-dump-100-rerank.jsonl"

[results.lme_qa_100]
files = ["results/lme-qa-oracle-11663.jsonl", "results/lme-qa-sessions-fused-11663.jsonl", "results/lme-qa-sessions-11663.jsonl"]
job = "jobs/lme-qa.sbatch"
questions = 100
top = 5
regenerate = "python3 scripts/tables.py --verdicts results/lme-qa-oracle-11663.jsonl --verdicts results/lme-qa-sessions-fused-11663.jsonl --verdicts results/lme-qa-sessions-11663.jsonl"

[results.locomo_dump]
file = "results/locomo-dump.jsonl"
job = "jobs/locomo-dump.sbatch"
questions = 1986
regenerate = "python3 scripts/tables.py results/locomo-dump.jsonl --gold evidence --type category"

[results.lme_dump_all_window]
file = "results/lme-dump-all-window.jsonl"
job = "jobs/lme-dump-all.sbatch"
questions = 470
arms = ["sessions", "sessions dense", "sessions fused", "sessions fused recency", "sessions fused window", "turns", "windows"]
packset_commit = "the window arm commit after v0.6.0 (feat(bench): a window arm)"
regenerate = "python3 scripts/tables.py results/lme-dump-all-window.jsonl"

[results.locomo_qa]
files = ["results/locomo-qa-oracle-top10-11672.jsonl", "results/locomo-qa-turns-fused-top20-11672.jsonl", "results/locomo-qa-turns-fused-top10-11672.jsonl", "results/locomo-qa-turns-top10-11672.jsonl"]
log = "results/locomo-qa-11672.txt"
job = "jobs/locomo-qa.sbatch"
questions = 1540
categories = "1 multi-hop, 2 temporal, 3 open-domain, 4 single-hop; 5 (adversarial) left out"
prompt = "the LongMemEval reading prompt over dated turns, each marked with its distance from the question"
regenerate = "python3 scripts/tables.py --verdicts results/locomo-qa-oracle-top10-11672.jsonl --verdicts results/locomo-qa-turns-fused-top20-11672.jsonl --verdicts results/locomo-qa-turns-fused-top10-11672.jsonl --verdicts results/locomo-qa-turns-top10-11672.jsonl"

[results.lme_dump_island]
file = "results/lme-dump-island.jsonl"
log = "results/lme-island-11737.txt"
job = "jobs/lme-dump-island.sbatch"
questions = 470
arms = ["sessions", "sessions dense", "sessions fused", "sessions fused recency", "sessions fused window", "sessions fused island", "turns", "windows"]
packset_commit = "the island arm commit after v0.7.2 (feat(bench): an island arm on LongMemEval)"
regenerate = "python3 scripts/tables.py results/lme-dump-island.jsonl"

[results.mab_dump]
file = "results/mab-dump.jsonl"
log = "results/mab-retrieval-11742.txt"
job = "jobs/mab-dump.sbatch"
questions = 2800
splits = ["Conflict_Resolution", "Accurate_Retrieval"]
arms = ["lexical", "dense", "fused", "fused latest (fact lists)", "fused live (fact lists)"]
note = "the package copy carries each question's split, row, index, type, date and the document indices each arm ranked; the question and answer text are the dataset's own words and are read back from it by (split, row, question_index). The log holds the answer-bearing proxy table as printed; the chunk store (~60 MB of benchmark text) stays out of the package and is rebuilt by the job."

[results.locomo_learn]
files = ["results/locomo-learn-none-top10-11752.jsonl", "results/locomo-learn-fsrs-top10-11752.jsonl", "results/locomo-learn-oracle-top10-11752.jsonl"]
dump = "results/locomo-dump-scored.jsonl"
log = "results/locomo-learn-11752.txt"
job = "jobs/locomo-learn.sbatch (after jobs/locomo-dump2.sbatch)"
questions = 1540
top = 10
protocol = "questions of one conversation in order; the turns handed to the reader graded after each answer (none: no grading; fsrs: by the judge's verdict; oracle: by the gold evidence); the next question's fused hits reweighed by FSRS retrievability since last review, floor 0.25"
regenerate = "python3 scripts/tables.py --verdicts results/locomo-learn-none-top10-11752.jsonl --verdicts results/locomo-learn-fsrs-top10-11752.jsonl --verdicts results/locomo-learn-oracle-top10-11752.jsonl"

[results.mab_qa_conflict]
files = ["results/mab-qa-fused-live-top10-11750.jsonl", "results/mab-qa-fused-latest-top10-11750.jsonl"]
log = "results/mab-qa-11750.txt"
job = "jobs/mab-qa.sbatch"
questions = 800
top = 10
note = "the conflict-resolution arms of the reading job; the reader server was killed for memory during the third arm (its host prompt cache), so the fused, lexical and top-five arms in this log are invalid past the first 815 answers and rerun as jobs/mab-qa2.sbatch"
regenerate = "python3 scripts/tables.py --verdicts results/mab-qa-fused-live-top10-11750.jsonl --verdicts results/mab-qa-fused-latest-top10-11750.jsonl"

[results.lme_qa_gaps]
file = "results/lme-qa-gaps-sessions-fused-top5-11753.jsonl"
log = "results/lme-qa-gaps-11753.txt"
job = "jobs/lme-qa-gaps.sbatch"
questions = 350
types = "temporal-reasoning, knowledge-update, multi-session, single-session-preference"
top = 5
prompt = "timeline, with the days between every pair of retrieved sessions listed after them (the harness default from this commit on)"
compare = "the raw and marked-distances arms of job 11705 over the same questions: 0.431 and 0.420 against 0.460"
regenerate = "python3 scripts/tables.py --verdicts results/lme-qa-gaps-sessions-fused-top5-11753.jsonl"
